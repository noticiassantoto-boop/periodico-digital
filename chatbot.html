<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Santoto — Santoto Noticias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── CHAT SHELL ── */
    .chat-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    /* Mensajes */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* Burbuja */
    .msg { display: flex; gap: 10px; align-items: flex-end; animation: msgIn .22s ease; }
    @keyframes msgIn { from { opacity:0; transform:translateY(7px);} to { opacity:1; transform:none;} }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--azul); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0; align-self: flex-end;
    }
    .msg-bubble {
      max-width: 74%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px; line-height: 1.65;
      font-family: var(--font-s);
    }
    .msg.bot .msg-bubble {
      background: var(--fondo-2);
      border: 1px solid var(--borde);
      border-bottom-left-radius: 4px;
      color: var(--texto);
    }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .msg-bubble {
      background: var(--azul); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot.error .msg-bubble { border-color: #f8c7c7; background: #fff5f5; color: #9b2020; }

    /* Tarjeta evento dentro del chat */
    .chat-event {
      background: var(--fondo);
      border: 1px solid var(--borde);
      border-left: 3px solid var(--azul);
      border-radius: var(--r-sm);
      padding: 9px 12px;
      margin: 5px 0 2px;
    }
    .chat-event .ce-title  { font-weight: 600; color: var(--texto); font-size: 13px; margin-bottom: 2px; }
    .chat-event .ce-fecha  { font-size: 11.5px; color: var(--azul); font-weight: 600; margin-bottom: 3px; }
    .chat-event .ce-desc   { font-size: 12px; color: var(--texto-2); line-height: 1.5; }
    .chat-event .ce-badge  {
      display: inline-block; margin-top: 5px;
      font-size: 10.5px; font-weight: 600;
      background: var(--azul-claro); color: var(--azul);
      border: 1px solid var(--azul-borde);
      padding: 1px 8px; border-radius: 10px;
    }

    /* Typing */
    .typing-wrap { display: flex; gap: 10px; align-items: flex-end; }
    .typing-bubble {
      background: var(--fondo-2); border: 1px solid var(--borde);
      border-radius: 18px; border-bottom-left-radius: 4px;
      padding: 12px 18px; display: flex; gap: 5px; align-items: center;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--texto-3); animation: pulse 1.1s infinite; }
    .dot:nth-child(2) { animation-delay:.18s; }
    .dot:nth-child(3) { animation-delay:.36s; }
    @keyframes pulse { 0%,80%,100%{opacity:.2;transform:scale(.85);} 40%{opacity:1;transform:scale(1.1);} }

    /* Sugerencias rápidas */
    .chips-wrap {
      padding: 2px 0 10px;
      display: flex; gap: 7px; flex-wrap: wrap;
      transition: opacity .3s;
    }
    .chip {
      padding: 6px 13px; border-radius: 20px; font-size: 12.5px;
      border: 1.5px solid var(--azul-borde); background: var(--azul-claro);
      color: var(--azul); cursor: pointer; font-family: var(--font-s);
      font-weight: 500; white-space: nowrap;
      transition: background .15s, color .15s, transform .1s;
    }
    .chip:hover  { background: var(--azul); color: #fff; transform: translateY(-1px); }
    .chip:active { transform: scale(.96); }

    /* Barra de input */
    .chat-bar {
      border-top: 1px solid var(--borde);
      padding: 12px 0 22px;
      display: flex; gap: 10px; align-items: flex-end;
    }
    .chat-input {
      flex: 1; padding: 11px 16px;
      border: 1.5px solid var(--borde); border-radius: 24px;
      font-family: var(--font-s); font-size: 14px; color: var(--texto);
      background: var(--fondo); resize: none; outline: none;
      max-height: 110px; overflow-y: auto; line-height: 1.5;
      transition: border-color .2s;
    }
    .chat-input:focus { border-color: var(--azul); }
    .chat-send {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--azul); color: #fff; border: none;
      cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s, transform .1s;
    }
    .chat-send:hover  { background: var(--azul-medio); }
    .chat-send:active { transform: scale(.93); }

    @media (max-width: 600px) {
      .msg-bubble { max-width: 86%; font-size: 13.5px; }
    }
  </style>
</head>
<body>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="IMG/esc.png" class="nav-logo" alt="Logo">
        <div class="nav-brand-text">
          <span class="nav-name">Santoto Noticias</span>
          <span class="nav-sub">Colegio Santo Tomás de Aquino</span>
        </div>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="Noticias.html" class="nav-link">Noticias</a>
        <a href="gobierno.html" class="nav-link">Gobierno</a>
        <a href="deportes.html" class="nav-link">Deportes</a>
        <a href="calendario.html" class="nav-link">Calendario</a>
        <a href="sugerencias.html" class="nav-link">Buzón</a>
        <a href="especialidades.html" class="nav-link">Especialidad</a>
        <a href="chatbot.html" class="nav-link active"> Asistente</a>
      </div>
      <button class="nav-hamburger" id="hamburger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="chat-shell">
    <div class="chat-messages" id="msgs"></div>

    <div class="chips-wrap" id="chips">
      <button class="chip" onclick="chip(this)">📅 Eventos de este mes</button>
      <button class="chip" onclick="chip(this)">📆 Próximo evento</button>
      <button class="chip" onclick="chip(this)">🎉 Eventos culturales</button>
      <button class="chip" onclick="chip(this)">📚 Eventos académicos</button>
      <button class="chip" onclick="chip(this)">🏖️ ¿Cuándo son las vacaciones?</button>
      <button class="chip" onclick="chip(this)">📰 Noticias recientes</button>
      <button class="chip" onclick="chip(this)">🏆 Logros deportivos</button>
      <button class="chip" onclick="chip(this)">👤 Gobierno estudiantil</button>
    </div>

    <div class="chat-bar">
      <textarea id="inp" class="chat-input" rows="1"
        placeholder="Pregúntame sobre eventos, fechas o noticias del colegio..."
        onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <button class="chat-send" onclick="send()">➤</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="main.js"></script>
  <script>
  // ══════════════════════════════════════════
  //   MOTOR DE RESPUESTAS LOCAL — SANTOTO BOT
  // ══════════════════════════════════════════

  const MESES = ['enero','febrero','marzo','abril','mayo','junio',
                 'julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const MESES_C = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                   'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIAS_SEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  function hoy() { return new Date(); }
  function parseF(s) { const [y,m,d] = s.split('-'); return new Date(+y, +m-1, +d); }
  function fmtFecha(s) {
    const d = parseF(s);
    return `${DIAS_SEM[d.getDay()]} ${d.getDate()} de ${MESES_C[d.getMonth()]} de ${d.getFullYear()}`;
  }
  function diasFaltan(s) {
    const hoyD = new Date(); hoyD.setHours(0,0,0,0);
    const ev = parseF(s); ev.setHours(0,0,0,0);
    return Math.round((ev - hoyD) / 86400000);
  }
  function estadoEvento(s) {
    const d = diasFaltan(s);
    if (d < 0)  return `ya ocurrió`;
    if (d === 0) return `<strong>¡ES HOY!</strong>`;
    if (d === 1) return `mañana`;
    return `en <strong>${d} días</strong>`;
  }
  function n(t) { return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  // Tarjeta HTML de un evento
  function tarjetaEvento(e) {
    const d = diasFaltan(e.fecha);
    const estado = d < 0 ? '✓ Ya ocurrió'
                 : d === 0 ? '🔴 ¡Hoy!'
                 : d === 1 ? '📌 Mañana'
                 : `📌 En ${d} días`;
    return `<div class="chat-event">
      <div class="ce-title">${e.icon||'📅'} ${e.titulo}</div>
      <div class="ce-fecha">${fmtFecha(e.fecha)}</div>
      <div class="ce-desc">${e.desc}</div>
      <span class="ce-badge">${e.categoria}</span>
      <span class="ce-badge" style="margin-left:4px">${estado}</span>
    </div>`;
  }

  // ── RESPONDER ────────────────────────────────────────
  function responder(txt) {
    const q = n(txt);
    const hoyDate = new Date(); hoyDate.setHours(0,0,0,0);
    const evs = DATA.eventos || [];
    const nots = DATA.noticias || [];
    const deps = DATA.deportes || [];
    const gov  = DATA.gobierno || [];

    // Próximos / pasados
    const proximos = evs.filter(e => diasFaltan(e.fecha) >= 0).sort((a,b)=>parseF(a.fecha)-parseF(b.fecha));
    const pasados  = evs.filter(e => diasFaltan(e.fecha) <  0).sort((a,b)=>parseF(b.fecha)-parseF(a.fecha));

    // ── SALUDO ──
    if (/^(hola|buenas|buenos|hey|hi|ola|saludos|que tal|buena)/.test(q)) {
      const pr = proximos[0];
      let extra = pr ? `<br><br>Por cierto, el próximo evento es <strong>${pr.titulo}</strong>, ${estadoEvento(pr.fecha)} (${fmtFecha(pr.fecha)}) 📅` : '';
      return `¡Hola! 👋 Soy el <strong>Asistente Santoto</strong>, aquí para ayudarte con información del Colegio Santo Tomás de Aquino.<br><br>Puedo decirte sobre eventos del calendario, noticias, fechas importantes, el gobierno estudiantil y más.${extra}<br><br>¿En qué te ayudo?`;
    }

    // ── PRÓXIMO EVENTO ──
    if (/proximo|siguiente|viene|proximamente|que hay pronto|que sigue|cuando es el siguiente/.test(q)) {
      if (!proximos.length) return 'No hay eventos próximos registrados en el calendario por el momento. 📭';
      const e = proximos[0];
      return `El próximo evento es:<br>${tarjetaEvento(e)}<br>¿Quieres ver todos los eventos del mes?`;
    }

    // ── TODOS LOS EVENTOS ──
    if (/todos los eventos|lista de eventos|que eventos hay|ver eventos|todos los actos/.test(q)) {
      if (!evs.length) return 'No hay eventos registrados.';
      return `Aquí están todos los eventos del año:<br><br>${evs.map(tarjetaEvento).join('')}`;
    }

    // ── EVENTOS DE ESTE MES ──
    if (/este mes|del mes|en el mes|mes actual|junio|mayo|abril|marzo|enero|febrero|julio|agosto|septiembre|octubre|noviembre|diciembre/.test(q)) {
      // detectar mes específico
      let mesIdx = hoyDate.getMonth();
      const nombresMes = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      for (let i=0;i<12;i++) { if (q.includes(nombresMes[i])) { mesIdx=i; break; } }
      const delMes = evs.filter(e => { const d=parseF(e.fecha); return d.getMonth()===mesIdx; });
      if (!delMes.length) return `No encontré eventos registrados en <strong>${MESES_C[mesIdx]}</strong>. Puedes revisar el <a href="calendario.html" style="color:var(--azul)">Calendario completo</a>.`;
      return `Eventos de <strong>${MESES_C[mesIdx]}</strong>:<br><br>${delMes.map(tarjetaEvento).join('')}`;
    }

    // ── VACACIONES / FIN DE AÑO ──
    if (/vacaciones|descanso|fin de año|finales|salida|ultimo dia/.test(q)) {
      const vac = evs.find(e => /vacacion|salida|fin de año/i.test(e.titulo+e.desc));
      const diasFest = evs.find(e => /estudiante/i.test(e.titulo));
      if (diasFest) {
        return `Las vacaciones y el Día del Estudiante son el <strong>${fmtFecha(diasFest.fecha)}</strong>, ${estadoEvento(diasFest.fecha)}.<br><br>${tarjetaEvento(diasFest)}`;
      }
      return `La salida a vacaciones está programada para el <strong>19 de junio de 2026</strong> (Día del Estudiante). ${estadoEvento('2026-06-19')}.`;
    }

    // ── EVENTOS CULTURALES ──
    if (/cultural|cultura|arte|musica|festival|danza|english day|jean day|jen day|izada/.test(q)) {
      const cult = evs.filter(e => /cultural|cultura|arte/i.test(e.categoria+e.titulo+e.desc));
      if (!cult.length) return 'No encontré eventos culturales próximos. Revisa el <a href="calendario.html" style="color:var(--azul)">Calendario</a>.';
      return `Eventos culturales registrados:<br><br>${cult.map(tarjetaEvento).join('')}`;
    }

    // ── ENGLISH DAY ──
    if (/english day|dia ingles|ingles/.test(q)) {
      const e = evs.find(ev => /english/i.test(ev.titulo));
      if (e) return `El <strong>English Day</strong> es el ${fmtFecha(e.fecha)}, ${estadoEvento(e.fecha)}.<br><br>${tarjetaEvento(e)}`;
      return 'No encontré información sobre el English Day. Revisa el calendario.';
    }

    // ── JEAN DAY / JEN DAY ──
    if (/jean day|jen day|jean|jeans/.test(q)) {
      const e = evs.find(ev => /jean|jen/i.test(ev.titulo));
      if (e) return `El <strong>Jean Day</strong> es el ${fmtFecha(e.fecha)}, ${estadoEvento(e.fecha)}.<br><br>${tarjetaEvento(e)}`;
      return 'No encontré información sobre el Jean Day.';
    }

    // ── DÍA DEL PROFESOR ──
    if (/profesor|docente|maestro|dia del profe/.test(q)) {
      const e = evs.find(ev => /profesor|docente/i.test(ev.titulo));
      if (e) return `El <strong>Día del Profesor</strong> es el ${fmtFecha(e.fecha)}, ${estadoEvento(e.fecha)}.<br><br>${tarjetaEvento(e)}`;
      return 'No encontré el Día del Profesor en el calendario.';
    }

    // ── DÍA DEL ESTUDIANTE ──
    if (/estudiante|dia del estudiante/.test(q)) {
      const e = evs.find(ev => /estudiante/i.test(ev.titulo));
      if (e) return `El <strong>Día del Estudiante</strong> es el ${fmtFecha(e.fecha)}, ${estadoEvento(e.fecha)}.<br><br>${tarjetaEvento(e)}`;
      return 'No encontré el Día del Estudiante en el calendario.';
    }

    // ── BOLETINES / NOTAS ──
    if (/boletin|boletines|notas|calificaciones|periodo|informe|reporte/.test(q)) {
      const e = evs.find(ev => /boletin|periodo/i.test(ev.titulo));
      if (e) return `La entrega de boletines es el ${fmtFecha(e.fecha)}, ${estadoEvento(e.fecha)}.<br><br>${tarjetaEvento(e)}`;
      return 'No encontré información sobre entrega de boletines próxima.';
    }

    // ── EVENTOS ACADÉMICOS ──
    if (/academico|academia|boletin|prueba|examen|estudio|escolar/.test(q)) {
      const ac = evs.filter(e => /academico|academ/i.test(e.categoria+e.titulo));
      if (!ac.length) return 'No encontré eventos académicos próximos.';
      return `Eventos académicos:<br><br>${ac.map(tarjetaEvento).join('')}`;
    }

    // ── CUÁNDO / FECHA específica ──
    if (/cuando es|que dia es|que fecha|a que hora|en que fecha/.test(q)) {
      // buscar coincidencia por título
      for (const e of evs) {
        const tit = n(e.titulo);
        const palabras = tit.split(' ').filter(p=>p.length>3);
        if (palabras.some(p => q.includes(p))) {
          return `<strong>${e.titulo}</strong> es el ${fmtFecha(e.fecha)}, ${estadoEvento(e.fecha)}.<br><br>${tarjetaEvento(e)}`;
        }
      }
      return '¿De qué evento me preguntas? Puedo decirte la fecha exacta si me dices el nombre del evento.';
    }

    // ── NOTICIAS ──
    if (/noticias|noticia|novedad|novedades|que paso|ultimas|recientes|informacion/.test(q)) {
      if (!nots.length) return 'No hay noticias disponibles.';
      const lista = nots.slice(0,4).map(n =>
        `<div class="chat-event" style="border-left-color:#7B2FAE">
          <div class="ce-title">${n.icon||'📰'} ${n.titulo}</div>
          <div class="ce-fecha">${fmtFecha(n.fecha)}</div>
          <div class="ce-desc">${n.resumen}</div>
          <span class="ce-badge" style="background:#f3e8ff;color:#7B2FAE;border-color:#e8d5f5">${n.categoria}</span>
        </div>`
      ).join('');
      return `Últimas noticias del colegio:<br><br>${lista}<br>Ver todas en <a href="noticias.html" style="color:var(--azul)">Noticias →</a>`;
    }

    // ── DEPORTES / LOGROS ──
    if (/deporte|deportivo|futbol|natacion|atletismo|logro|medalla|campeon|torneo|samuel/.test(q)) {
      if (!deps.length) return 'No hay información deportiva disponible.';
      const lista = deps.map(d =>
        `<div class="chat-event" style="border-left-color:#B8902A">
          <div class="ce-title">${d.icon} ${d.titulo}</div>
          <div class="ce-fecha">${fmtFecha(d.fecha)} · ${d.disciplina}</div>
          <div class="ce-desc">${d.descripcion}</div>
          <span class="ce-badge" style="background:#fef3c7;color:#92400e;border-color:#fde68a">${d.tipo}</span>
        </div>`
      ).join('');
      return `Deportes y logros del colegio:<br><br>${lista}`;
    }

    // ── GOBIERNO ESTUDIANTIL ──
    if (/gobierno|personero|personera|contralor|representante|lider|directivo/.test(q)) {
      const personero = gov.find(g => g.tipo==='personero');
      const contralor = gov.find(g => g.tipo==='contralor');
      let resp = '🏛️ <strong>Gobierno Estudiantil 2025:</strong><br><br>';
      if (personero) resp += `• <strong>Personera:</strong> ${personero.nombre} (Grado ${personero.curso})<br>`;
      if (contralor) resp += `• <strong>Contralora:</strong> ${contralor.nombre}<br>`;
      resp += `<br>Hay ${gov.filter(g=>g.tipo==='representantes').length} representantes de grado.<br><br>`;
      resp += `Ver todos en <a href="gobierno.html" style="color:var(--azul)">Gobierno Estudiantil →</a>`;
      return resp;
    }

    // ── RECTOR ──
    if (/rector|director|horacio|pedraza/.test(q)) {
      return '👔 El rector del colegio es <strong>Horacio Pedraza Becerra</strong>, reconocido por su compromiso con la formación integral de más de 2.100 estudiantes. Fue postulado al reconocimiento "Gigante en Educación con Sentido Humano".';
    }

    // ── SENA / ESPECIALIDAD ──
    if (/sena|especiali|informatic|tecnic|sistemas|articulacion/.test(q)) {
      return '💻 El colegio ofrece la especialidad de <strong>Taller de Informática</strong>, articulada con el SENA. Los estudiantes de grado 11° obtienen el certificado de <strong>técnico en sistemas</strong>, con formación en redes, computadores y TIC.<br><br>Más info en <a href="especialidades.html" style="color:var(--azul)">Especialidad →</a>';
    }

    // ── RANKING / MILTON OCHOA ──
    if (/ranking|milton ochoa|mejores colegios|puesto|clasificacion|posicion/.test(q)) {
      return '🏆 El Colegio Santo Tomás de Aquino aparece en el <strong>ranking Milton Ochoa</strong> como uno de los mejores colegios públicos de Duitama para el período 2024-2025. Un orgullo para toda la comunidad santotomista.';
    }

    // ── INFRAESTRUCTURA ──
    if (/infraestructura|obras|construccion|inversion|remodelacion|instalaciones|millones/.test(q)) {
      return '🏗️ La administración municipal invirtió <strong>$4.500 millones de pesos</strong> en la ampliación y modernización del colegio: nuevas aulas, laboratorios de tecnología, espacios deportivos y biblioteca renovada.';
    }

    // ── CUÁNTOS DÍAS PARA... ──
    if (/cuanto(s)? dia(s)?|cuanto falta|faltan|faltan para|dias para/.test(q)) {
      for (const e of proximos) {
        const tit = n(e.titulo);
        const palabras = q.split(' ').filter(p=>p.length>3);
        if (palabras.some(p => tit.includes(p))) {
          const d = diasFaltan(e.fecha);
          return `Para <strong>${e.titulo}</strong> ${d===0?'es hoy mismo 🔴':d===1?'falta <strong>1 día</strong> (mañana)':`faltan <strong>${d} días</strong>`}.<br>${tarjetaEvento(e)}`;
        }
      }
      // Si no encuentra específico, responde con el próximo
      if (proximos.length) {
        const e = proximos[0];
        const d = diasFaltan(e.fecha);
        return `El próximo evento es <strong>${e.titulo}</strong> y ${d===0?'¡es hoy!':d===1?'es mañana':`faltan <strong>${d} días</strong>`}.<br>${tarjetaEvento(e)}`;
      }
      return 'No hay eventos próximos registrados.';
    }

    // ── AYUDA / QUÉ PUEDES HACER ──
    if (/ayuda|que puedes|que sabes|como funciona|que haces|para que sirves|capacidades|help/.test(q)) {
      return `Puedo ayudarte con: <br><br>
        📅 <strong>Calendario</strong> — eventos, fechas, cuántos días faltan<br>
        📰 <strong>Noticias</strong> — últimas novedades del colegio<br>
        🏆 <strong>Deportes</strong> — logros y torneos<br>
        🏛️ <strong>Gobierno</strong> — personera, contralora, representantes<br>
        💻 <strong>Especialidad</strong> — Taller de Informática y SENA<br>
        👔 <strong>Rector</strong> — información del directivo<br><br>
        Escríbeme lo que necesitas saber 😊`;
    }

    // ── GRACIAS ──
    if (/gracias|thank|muchas gracias|perfecto|excelente|genial|chevere|buenísimo/.test(q)) {
      return '¡Con mucho gusto! 😊 Si tienes más preguntas sobre el colegio, aquí estoy.';
    }

    // ── BÚSQUEDA GENERAL POR PALABRAS CLAVE EN EVENTOS ──
    const palabrasQ = q.split(/\s+/).filter(p => p.length > 3);
    const encontrado = evs.find(e => {
      const texto = n(e.titulo + ' ' + e.desc + ' ' + e.categoria);
      return palabrasQ.some(p => texto.includes(p));
    });
    if (encontrado) {
      return `Encontré esto que puede interesarte:<br><br>${tarjetaEvento(encontrado)}`;
    }

    // Buscar en noticias
    const notEnc = nots.find(noticia => {
      const texto = n(noticia.titulo + ' ' + noticia.resumen + ' ' + noticia.categoria);
      return palabrasQ.some(p => texto.includes(p));
    });
    if (notEnc) {
      return `Encontré esta noticia relacionada:<br><br>
        <div class="chat-event" style="border-left-color:#7B2FAE">
          <div class="ce-title">${notEnc.icon||'📰'} ${notEnc.titulo}</div>
          <div class="ce-fecha">${fmtFecha(notEnc.fecha)}</div>
          <div class="ce-desc">${notEnc.resumen}</div>
        </div>`;
    }

    // ── RESPUESTA POR DEFECTO ──
    return `Mmm, no encontré información específica sobre eso 🤔<br><br>
      Puedo ayudarte con:<br>
      • 📅 Eventos y fechas del calendario<br>
      • 📰 Noticias del colegio<br>
      • 🏆 Logros deportivos<br>
      • 🏛️ Gobierno estudiantil<br>
      • 💻 Especialidad de Informática<br><br>
      ¿Sobre cuál de esos temas quieres saber?`;
  }

  // ══════════════════════════════════════════
  //   UI
  // ══════════════════════════════════════════

  function esc(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addMsg(role, html, isError=false) {
    const box = document.getElementById('msgs');
    const d = document.createElement('div');
    d.className = `msg ${role}${isError?' error':''}`;
    if (role === 'bot') {
      d.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble">${html}</div>`;
    } else {
      d.innerHTML = `<div class="msg-bubble">${esc(html)}</div>`;
    }
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  function showTyping() {
    const box = document.getElementById('msgs');
    const d = document.createElement('div');
    d.id = 'typing'; d.className = 'typing-wrap';
    d.innerHTML = `<div class="msg-avatar">🤖</div>
      <div class="typing-bubble">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>`;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
  function hideTyping() { const el=document.getElementById('typing'); if(el)el.remove(); }

  function send(textOverride) {
    const inp = document.getElementById('inp');
    const txt = (textOverride !== undefined ? textOverride : inp.value).trim();
    if (!txt) return;

    // ocultar chips
    document.getElementById('chips').style.opacity = '0.4';
    document.getElementById('chips').style.pointerEvents = 'none';

    inp.value = ''; inp.style.height = 'auto';
    addMsg('user', txt);

    showTyping();
    // Simular latencia mínima para naturalidad
    setTimeout(() => {
      hideTyping();
      const resp = responder(txt);
      addMsg('bot', resp);
    }, 420);
  }

  function chip(el) {
    send(el.textContent.trim());
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }
  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  // ── BIENVENIDA ──
  window.addEventListener('DOMContentLoaded', () => {
    const proximos = (DATA.eventos||[])
      .filter(e => diasFaltan(e.fecha) >= 0)
      .sort((a,b) => parseF(a.fecha)-parseF(b.fecha));
    const pr = proximos[0];
    const hoyFmt = `${DIAS_SEM[new Date().getDay()]} ${new Date().getDate()} de ${MESES_C[new Date().getMonth()]}`;
    let extra = '';
    if (pr) {
      const d = diasFaltan(pr.fecha);
      extra = `<br><br>📅 El próximo evento es <strong>${pr.titulo}</strong>, ${d===0?'<strong>¡hoy mismo!</strong>':d===1?'<strong>mañana</strong>':`en <strong>${d} días</strong>`} (${fmtFecha(pr.fecha)}).`;
    }
    setTimeout(() => {
      addMsg('bot', `👋 ¡Hola! Soy el <strong>Asistente Santoto</strong>.<br>Hoy es <strong>${hoyFmt}</strong>. Puedo contarte sobre eventos del calendario, noticias y más del Colegio Santo Tomás de Aquino.${extra}<br><br>¿En qué te puedo ayudar?`);
    }, 300);
  });
  </script>
